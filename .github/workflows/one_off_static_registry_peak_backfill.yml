name: one-off static registry peak backfill

on:
  push:
    branches:
      - chatgpt/20260726-development-model-registry-backfill
    paths:
      - .github/workflows/one_off_static_registry_peak_backfill.yml

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Check out registry branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/20260726-development-model-registry-backfill
          fetch-depth: 1
          show-progress: false

      - name: Patch static-condensed peak cells
        run: python .github/scripts/one_off_static_registry_peak_backfill.py

      - name: Validate registry markdown
        run: python src/test/test_183_development_model_registry_markdown.py

      - name: Validate static peak coverage
        run: |
          grep -F 'peak `历史未冻结`；build `35.64 s`' docs/development_model_registry.md
          grep -F 'peak `历史未冻结`；build/setup/solve `24.72/36.48/0.077 s`' docs/development_model_registry.md
          grep -F 'p6/h10同时有隔离direct peak `15.964 GiB`' docs/development_model_registry.md

      - name: Commit registry-only result and remove helpers
        run: |
          git config user.name 'chatgpt-registry-backfill'
          git config user.email 'chatgpt-registry-backfill@users.noreply.github.com'
          git rm .github/scripts/one_off_static_registry_peak_backfill.py .github/workflows/one_off_static_registry_peak_backfill.yml
          git add docs/development_model_registry.md
          git diff --cached --check
          git commit -m 'docs: clarify static-condensed peak memory coverage'
          git push origin HEAD:chatgpt/20260726-development-model-registry-backfill
