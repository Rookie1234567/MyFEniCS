name: one-off development registry backfill

on:
  push:
    branches:
      - chatgpt/20260726-development-model-registry-backfill
    paths:
      - .github/workflows/one_off_registry_backfill.yml

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Check out registry branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/20260726-development-model-registry-backfill
          fetch-depth: 0

      - name: Backfill registry
        run: python .github/scripts/one_off_registry_backfill.py

      - name: Validate required Task034 coverage
        run: |
          grep -F '| Task034 Full3D | p2/h2 |' docs/development_model_registry.md
          grep -F '| Task034 Full3D | p3/h3 |' docs/development_model_registry.md
          grep -F '| Task034 Full3D | p4/h5 |' docs/development_model_registry.md
          grep -F '| Task034 Hybrid M160 | p4/h5 |' docs/development_model_registry.md
          grep -F '## 3.35 Task034：WSL、固定几何 p2/p3/p4 收敛矩阵、Hybrid 与 graded-h' docs/development_model_registry.md

      - name: Commit only the registry result and remove one-off helpers
        run: |
          git config user.name 'chatgpt-registry-backfill'
          git config user.email 'chatgpt-registry-backfill@users.noreply.github.com'
          git rm .github/scripts/one_off_registry_backfill.py .github/workflows/one_off_registry_backfill.yml
          git add docs/development_model_registry.md
          git diff --cached --check
          git commit -m 'docs: backfill Task034 convergence and Hybrid model registry'
          git push origin HEAD:chatgpt/20260726-development-model-registry-backfill
