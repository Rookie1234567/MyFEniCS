name: one-off COMSOL registry and markdown repair

on:
  push:
    branches:
      - chatgpt/20260726-development-model-registry-backfill
    paths:
      - .github/workflows/one_off_comsol_registry_backfill.yml
  pull_request:
    branches:
      - codex/20260726-task35c-hybrid-channel-memory-closure
    paths:
      - .github/workflows/one_off_comsol_registry_backfill.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out registry branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/20260726-development-model-registry-backfill
          fetch-depth: 1
          show-progress: false

      - name: Backfill COMSOL models
        run: python .github/scripts/one_off_comsol_registry_backfill.py

      - name: Repair generated Markdown rows
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/development_model_registry.md')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '| `C-COMSOL-HO-S` | COMSOL p2–p6直接法与p2 GMRES+GMG收敛矩阵 | '
                  '固定三维高阶benchmark；精确geometry/source hash保存在MPH而非Markdown | '
                  '13.5 nm项目主点；偏振/入射身份以MPH为准 | '
                  '双Floquet/周期端口；保存R00与总R/T/A，未逐项冻结12通道复振幅 | '
                  '`docs/COMSOL_direct_solver_report.md` |',
                  '| `C-COMSOL-HO-S` | COMSOL p2–p6直接法与p2 GMRES+GMG收敛矩阵 | '
                  '固定三维高阶benchmark；精确geometry/source hash保存在MPH而非Markdown | '
                  '13.5 nm项目主点；入射身份以MPH为准 | '
                  '偏振身份以MPH为准（Markdown未冻结） | '
                  '双Floquet/周期端口；保存R00与总R/T/A，未逐项冻结12通道复振幅 | '
                  '`docs/COMSOL_direct_solver_report.md` |',
              ),
              (
                  '| `task035c_p6_h10_hybrid_static_M160` | same source；MPI8 | '
                  '17,248 rows；same local matrix/factor inventory | '
                  'RSS7.929GiB；PSS/USS `6.169376/5.888676 GiB`；393.84s；'
                  '12/12+12/12；相对M120无物理收益 | '
                  '`success_not_selected`；RSS -29.50%，PSS/USS -35.81%/-37.16% | '
                  'same compact records |',
                  '| `task035c_p6_h10_hybrid_static_M160` | same source；MPI8 | '
                  '`F-HO-S`；local p6/h10 ends + discrete modal middle | '
                  '17,248 rows；same local matrix/factor inventory | '
                  'RSS7.929GiB；PSS/USS `6.169376/5.888676 GiB`；393.84s；'
                  '12/12+12/12；相对M120无物理收益 | '
                  '`success_not_selected`；RSS -29.50%，PSS/USS -35.81%/-37.16% | '
                  'same compact records |',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Markdown row was not found: {old[:80]}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate Markdown tables and fences
        id: markdown_validation
        continue-on-error: true
        shell: bash
        run: |
          python src/test/test_183_development_model_registry_markdown.py > /tmp/registry-markdown-test.log 2>&1

      - name: Upload Markdown diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: registry-markdown-diagnostics
          path: |
            /tmp/registry-markdown-test.log
            docs/development_model_registry.md
          if-no-files-found: error

      - name: Stop on Markdown validation failure
        if: steps.markdown_validation.outcome != 'success'
        run: |
          cat /tmp/registry-markdown-test.log
          exit 1

      - name: Validate key rendered-table sources
        run: |
          grep -F '#### 二阶（p2）直接法' docs/development_model_registry.md
          grep -F '#### 六阶（p6）直接法' docs/development_model_registry.md
          grep -F '#### p2 GMRES + GMG 网格序列' docs/development_model_registry.md
          grep -F '#### COMSOL P 偏振求解器 profile 对照' docs/development_model_registry.md
          if grep -F '相对直接法 `|Δ(R+T)|`' docs/development_model_registry.md; then
            echo 'raw pipe table-header bug remains' >&2
            exit 1
          fi

      - name: Commit repaired registry and remove one-off helpers
        run: |
          git config user.name 'chatgpt-registry-backfill'
          git config user.email 'chatgpt-registry-backfill@users.noreply.github.com'
          git rm .github/scripts/one_off_comsol_registry_backfill.py .github/workflows/one_off_comsol_registry_backfill.yml
          git add docs/development_model_registry.md
          git diff --cached --check
          git commit -m 'docs: complete COMSOL registry and repair Markdown tables'
          git push origin HEAD:chatgpt/20260726-development-model-registry-backfill
